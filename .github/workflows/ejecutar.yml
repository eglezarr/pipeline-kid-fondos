name: Ejecutar pipeline

# Lanza a mano una ejecución de la máquina de estados del pipeline (Step Functions) para una
# gestora o para todas, espera a que termine y muestra el resumen de cada gestora y el contenido
# de la base de datos. La ejecución también puede seguirse paso a paso en la consola de Step Functions.
# El pipeline se ejecuta además de forma programada (EventBridge Scheduler), el día 15 de cada mes.

on:
  workflow_dispatch:
    inputs:
      gestora:
        description: Gestora
        type: choice
        options: [todas, bestinver, azvalor]
        default: todas

permissions:
  id-token: write # necesario para OIDC
  contents: read

env:
  AWS_REGION: eu-west-3

jobs:
  pipeline:
    name: Pipeline (${{ inputs.gestora }})
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Iniciar la ejecución
        env:
          GESTORA: ${{ inputs.gestora }}
        run: |
          maquina=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='pipeline-kid-pipeline'].stateMachineArn" --output text)
          if [ "$GESTORA" = "todas" ]; then
            entrada='{"gestoras": ["bestinver", "azvalor"]}'
          else
            entrada=$(jq -nc --arg g "$GESTORA" '{gestoras: [$g]}')
          fi
          ejecucion=$(aws stepfunctions start-execution --state-machine-arn "$maquina" \
            --input "$entrada" --query executionArn --output text)
          echo "Ejecución: ${ejecucion##*:}"
          echo "EJECUCION=$ejecucion" >> "$GITHUB_ENV"

      - name: Esperar a que termine
        run: |
          while true; do
            estado=$(aws stepfunctions describe-execution --execution-arn "$EJECUCION" --query status --output text)
            echo "$(date -u +%H:%M:%S) $estado"
            [ "$estado" != "RUNNING" ] && break
            sleep 30
          done
          echo "ESTADO=$estado" >> "$GITHUB_ENV"

      - name: Resultado
        run: |
          if [ "$ESTADO" = "SUCCEEDED" ]; then
            # Resumen de la carga de cada gestora (respuesta de la etapa 4)
            aws stepfunctions describe-execution --execution-arn "$EJECUCION" --query output --output text \
              | jq '.gestoras[] | {gestora, fecha, kids_cargados: (.claves | length), filas_antes, filas_despues, fallos}'
          else
            # Gestoras fallidas: etapa y mensaje de error
            aws stepfunctions get-execution-history --execution-arn "$EJECUCION" --reverse-order \
              --query 'events[?type==`TaskFailed` || type==`ExecutionFailed`]' \
              | jq '[.[] | {tipo: .type, error: (.taskFailedEventDetails // .executionFailedEventDetails // {})}]'
            exit 1
          fi

      - name: Contenido de la base de datos
        run: |
          read -r cluster secreto <<< "$(aws rds describe-db-clusters --db-cluster-identifier pipeline-kid-bd \
            --query 'DBClusters[0].[DBClusterArn, MasterUserSecret.SecretArn]' --output text)"
          aws rds-data execute-statement --resource-arn "$cluster" --secret-arn "$secreto" --database fondos \
            --format-records-as JSON --query formattedRecords --output text \
            --sql "SELECT fuente, count(*) AS kids, round(avg(sri), 2) AS sri_medio,
                          round(avg(gastos_corrientes_pct), 3) AS gastos_corrientes_medios
                     FROM kid_actual GROUP BY fuente ORDER BY fuente" | jq .
