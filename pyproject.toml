[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Módulos del propio repositorio (las etapas se ejecutan con su carpeta en el path)
known-first-party = [
  "common", "utilidades_web", "gestora_bestinver", "gestora_azvalor", "captura",
  "pdf_a_markdown", "extractor_kid", "cargar_kids", "api_fondos",
  "calculos", "cliente_api", "componentes", "datos",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "webscrapper", "pdf_markdown", "structured_output", "carga", "api", "app"]
